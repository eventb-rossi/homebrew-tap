name: Release tracker

on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC (safety net + third-party upstreams)
  workflow_dispatch: {}
  # An eventb-rossi upstream tool just released: scan now instead of waiting for
  # tomorrow's cron (dispatched by eventb-rossi/release-automation).
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: release-tracker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Partition the tap's formulae between the two bump jobs below, from the tap
  # contents instead of a hand-maintained list (a hardcoded one silently dropped
  # formulae before — see ci.yml). brew bump-formula-pr can only rewrite a
  # TOP-LEVEL url stanza: a formula whose urls are all nested in on_os/on_arch
  # blocks (per-platform prebuilt artifacts) makes it die with "Could not find
  # 'url' stanza!" and fails the whole job. So split on that very property —
  # any future formula with per-platform urls is routed automatically — and
  # give those formulae to the dedicated bump-per-os job instead.
  list-formulae:
    runs-on: ubuntu-latest
    outputs:
      top-level: ${{ steps.list.outputs.top-level }}
      per-os: ${{ steps.list.outputs.per-os }}
    steps:
      - uses: actions/checkout@v7
      # bump-packages expects the names space-separated on ONE line: it parses
      # the input with `read -a`, which stops at the first newline, so a YAML
      # block list silently checked only the first formula. The matrix in
      # bump-per-os needs a JSON array instead.
      - id: list
        run: |
          top=() per_os=()
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            if grep -qE '^  url "' "$f"; then
              top+=("eventb-rossi/tap/$name")
            else
              per_os+=("$name")
            fi
          done
          echo "top-level=${top[*]}" >> "$GITHUB_OUTPUT"
          echo "per-os=$(jq -cn '$ARGS.positional' --args "${per_os[@]}")" >> "$GITHUB_OUTPUT"

  # GitHub-sourced formulae have version-derivable URLs, so the version + sha256
  # bump is mechanical: open update PRs via Homebrew's official action.
  bump-formulae:
    needs: list-formulae
    runs-on: ubuntu-latest
    # brew bump-formula-pr commits the version bump; brew takes the git
    # author/committer identity from these (the runner has none configured).
    env:
      HOMEBREW_GIT_NAME: github-actions[bot]
      HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
      # Homebrew/actions refs are pinned to a CalVer release tag rather than a
      # branch: upstream deleted the `master` branch on 2026-09-13, which broke
      # this job's "Set up job" for five days ("Unable to resolve action
      # homebrew/actions@master"). Dependabot's github-actions group keeps a tag
      # pin current (see .github/dependabot.yml); it cannot track branch refs,
      # which is exactly why the drift went unnoticed.
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
        with:
          # bump-formula-pr runs `brew audit`, which must resolve the formulae's
          # homebrew/core dependencies (openjdk*). The Linux runner has no core
          # tap and its API-based resolution failed there ("Can't find dependency
          # 'openjdk@21'"), so clone the core tap explicitly.
          core: true
      - uses: ./.github/actions/setup-tap

      # b2program needs no exclusion: its livecheck is `skip`-ed upstream and
      # `brew bump` skips it gracefully.
      - name: Open PRs for outdated formulae
        uses: Homebrew/actions/bump-packages@2026.09.28.1
        with:
          # Default GITHUB_TOKEN can't push branches / open PRs that re-trigger CI,
          # and brew bump needs write access. Uses the org secret VERSION_BUMP_TOKEN
          # (a PAT with Contents + Pull requests: write), shared across the
          # eventb-rossi packaging repos.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
          fork: false            # we own the tap; push the bump branch directly
          formulae: ${{ needs.list-formulae.outputs.top-level }}

  # The formulae with per-platform urls, which bump-formulae can't handle: bump
  # them ourselves. Detect via livecheck, rewrite the version in every url,
  # recompute each sha256 from the release assets, and open an auto-merge PR.
  bump-per-os:
    needs: list-formulae
    if: ${{ needs.list-formulae.outputs.per-os != '[]' }}
    strategy:
      fail-fast: false     # one formula's broken release must not block the others
      matrix:
        formula: ${{ fromJSON(needs.list-formulae.outputs.per-os) }}
    runs-on: ubuntu-latest
    # Used as the git author/committer for the bump commit (the runner has none).
    env:
      HOMEBREW_GIT_NAME: github-actions[bot]
      HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          # Push the bump branch + open a PR that re-triggers CI (the default
          # GITHUB_TOKEN can't), so auto-merge can gate on the ci.yml checks.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
        with:
          # actions/checkout@v7 no longer persists the token inline in
          # .git/config (it moved to an includeIf-referenced file under
          # RUNNER_TEMP), so the manual `git push` below ran unauthenticated
          # ("could not read Username"). Hand setup-homebrew the same token so it
          # sets the global github.com credential, which persists for the job.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
      - uses: ./.github/actions/setup-tap

      - name: Bump ${{ matrix.formula }} if a newer release exists
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
          NAME: ${{ matrix.formula }}
        run: |
          set -euo pipefail

          # Detect with the same livecheck used for every other formula.
          json="$(brew livecheck "eventb-rossi/tap/$NAME" --newer-only --json)"
          [ "$(jq 'length' <<<"$json")" -eq 0 ] && { echo "$NAME is up to date"; exit 0; }
          old="$(jq -r '.[0].version.current' <<<"$json")"
          new="$(jq -r '.[0].version.latest'  <<<"$json")"
          branch="bump-$NAME-$new"
          echo "Bumping $NAME $old -> $new"

          # Idempotent: skip if a PR for this version was already opened.
          if [ "$(gh pr list --head "$branch" --state all --json number --jq 'length')" -ne 0 ]; then
            echo "PR for $branch already exists"; exit 0
          fi

          f="Formula/$NAME.rb"
          # The version appears only on the url lines: in the /v<version>/ path,
          # plus the asset name or a tag: pin.
          old_re="${old//./\\.}"
          sed -i "\|/releases/download/v$old_re/|s|$old_re|$new|g" "$f"
          # Recompute every platform's sha256 from its (now version-bumped)
          # release asset, driven by the formula's own url list — so adding or
          # dropping a platform needs no change here. A url repeated across
          # on_arch blocks is hashed once and its every sha256 updated. Downloading
          # also confirms each asset exists, and we hash exactly the urls the
          # formula will ship.
          for u in $(grep -oE 'https://[^"]+/releases/download/[^"]+' "$f" | sort -u); do
            sum="$(curl -fsSL "$u" | sha256sum | cut -d' ' -f1)"
            awk -v a="$u" -v s="$sum" '
              index($0, a) { hit=1 }
              hit && /sha256 "/ { sub(/sha256 "[0-9a-f]+"/, "sha256 \"" s "\""); hit=0 }
              { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # Gate the bump on the same checks ci.yml runs.
          brew style "$f"
          brew audit --formula "eventb-rossi/tap/$NAME"

          git config user.name  "$HOMEBREW_GIT_NAME"
          git config user.email "$HOMEBREW_GIT_EMAIL"
          git switch -c "$branch"
          git commit -am "$NAME $new"
          # Force-push is safe: the guard above guarantees no PR references this
          # branch, so any existing remote branch is an orphan from a failed run.
          git push -u --force origin "$branch"
          url="$(gh pr create --base main --head "$branch" --title "$NAME $new" \
            --body "Automated bump of \`$NAME\` $old → $new. Per-platform sha256 values recomputed from the v$new release assets. \`brew bump-formula-pr\` can't rewrite $NAME's on_os/on_arch urls, so the release tracker bumps it with this dedicated job.")"
          # Non-fatal: if "Allow auto-merge"/required checks aren't configured the
          # PR is still opened for manual merge (and the guard above skips re-runs).
          gh pr merge --auto --squash "$url" \
            || echo "::warning::Could not enable auto-merge; merge $url manually."

  # ProB2-UI uses version-derived DMG names for both architectures. Homebrew's
  # bump-cask-pr only refreshes the current architecture's checksum for its
  # root-level sha256 map, so download and hash both artifacts ourselves.
  bump-prob2-ui:
    runs-on: macos-latest
    env:
      HOMEBREW_GIT_NAME: github-actions[bot]
      HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
      - uses: ./.github/actions/setup-tap

      - name: Bump ProB2-UI if both macOS DMGs are available
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          json="$(brew livecheck eventb-rossi/tap/prob2-ui --cask --newer-only --json)"
          [ "$(jq 'length' <<<"$json")" -eq 0 ] && { echo "prob2-ui is up to date"; exit 0; }
          old="$(jq -r '.[0].version.current' <<<"$json")"
          new="$(jq -r '.[0].version.latest' <<<"$json")"
          [[ "$old" =~ ^[0-9]+(\.[0-9]+)+$ && "$new" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          branch="bump-prob2-ui-$new"

          # A closed, unmerged PR needs manual review; the tracking issue below
          # remains the fallback. Do not silently reopen the same bump.
          if [ "$(gh pr list --head "$branch" --state all --json number --jq 'length')" -ne 0 ]; then
            echo "PR for $branch already exists"; exit 0
          fi

          # A notarized Apple Silicon ZIP would be preferable to the unsigned
          # DMG and needs a manual cask review rather than this DMG-only bump.
          listing="$(curl -fsSL "https://stups.hhu-hosting.de/downloads/prob2/${new}/")"
          if grep -Fq "ProB2-UI-aarch64-${new}-notarized.zip" <<<"$listing"; then
            echo "Notarized Apple Silicon ZIP found; leaving this release for manual review" >&2
            exit 1
          fi

          for arch in aarch64 x86_64; do
            file="$RUNNER_TEMP/ProB2-UI-${arch}-${new}.dmg"
            url="https://stups.hhu-hosting.de/downloads/prob2/${new}/ProB2-UI-${arch}-${new}.dmg"
            curl -fsSL --retry 3 "$url" -o "$file"
            hdiutil verify "$file" > /dev/null
          done
          arm_sha="$(shasum -a 256 "$RUNNER_TEMP/ProB2-UI-aarch64-${new}.dmg" | cut -d' ' -f1)"
          intel_sha="$(shasum -a 256 "$RUNNER_TEMP/ProB2-UI-x86_64-${new}.dmg" | cut -d' ' -f1)"

          f=Casks/prob2-ui.rb
          ruby - "$f" "$old" "$new" "$arm_sha" "$intel_sha" <<'RUBY'
          path, old, latest, arm, intel = ARGV
          contents = File.read(path)
          {
            /^  version "#{Regexp.escape(old)}"$/ => "  version \"#{latest}\"",
            /^  sha256 arm:\s+"[0-9a-f]{64}",$/ => "  sha256 arm:   \"#{arm}\",",
            /^         intel:\s+"[0-9a-f]{64}"$/ => "         intel: \"#{intel}\"",
          }.each do |pattern, replacement|
            raise "Expected exactly one #{pattern} in #{path}" unless contents.scan(pattern).length == 1

            contents.sub!(pattern, replacement)
          end
          File.write(path, contents)
          RUBY

          git diff --check
          brew style "$f"
          brew audit --cask eventb-rossi/tap/prob2-ui

          git config user.name "$HOMEBREW_GIT_NAME"
          git config user.email "$HOMEBREW_GIT_EMAIL"
          git switch -c "$branch"
          git add "$f"
          git commit -m "prob2-ui $new"
          # No PR references this branch (guarded above). Replace an orphan
          # branch left by a run that pushed but failed before opening its PR.
          git push -u --force origin "$branch"

          body="Automated bump of prob2-ui from $old to $new. Both macOS DMGs were downloaded, verified, and hashed; brew style and audit passed."
          issue="$(GH_TOKEN="$ISSUE_TOKEN" gh issue list --label livecheck --state open --limit 200 --json number,title |
            jq -r --arg title "prob2-ui: $old → $new" '[.[] | select(.title == $title) | .number] | first // empty')"
          if [ -n "$issue" ]; then
            body="$body

          Closes #$issue"
          fi
          gh pr create --base main --head "$branch" --title "prob2-ui $new" --body "$body"

  # Rodin's URLs have opaque build ids and Atelier B's upload paths vary by
  # release. Track those casks manually. ProB2-UI also gets a tracking issue if
  # its automatic bump cannot open a PR (for example, a DMG is missing).
  track-casks:
    needs: bump-prob2-ui
    if: ${{ always() }}
    runs-on: macos-latest        # Linux Homebrew cannot livecheck casks
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
      - uses: ./.github/actions/setup-tap

      - name: File issues for outdated casks
        env:
          GH_TOKEN: ${{ github.token }}   # issue create/update only; no org PAT needed
        run: |
          set -euo pipefail

          # Scan every cask in the tap (no hardcoded list to keep in sync as the tap
          # grows). livecheck exits non-zero if a source is unreachable; don't abort
          # the whole job — parse whatever JSON it produced.
          brew livecheck --tap eventb-rossi/tap --cask --newer-only --json > casks.json || true

          # Idempotent label.
          gh label create livecheck \
            --color FBCA04 \
            --description "Upstream release detected by brew livecheck" 2>/dev/null || true

          # Snapshot of open tracking issues, taken before we create any.
          existing="$(gh issue list --label livecheck --state open --json number,title --limit 200)"

          # name<TAB>current<TAB>latest for each genuinely-newer cask (strip the
          # tap prefix that --tap puts on the cask token).
          jq -r '.[]
                 | select(.version.latest != null and .version.current != .version.latest)
                 | [(.cask | sub("^.*/"; "")), .version.current, .version.latest]
                 | @tsv' casks.json |
          while IFS=$'\t' read -r name current latest; do
            title="${name}: ${current} → ${latest}"

            if [ "$name" = "prob2-ui" ] &&
               [ "$(gh pr list --head "bump-prob2-ui-$latest" --state open --json number --jq 'length')" -ne 0 ]; then
              echo "Already has an open bump PR: $name $latest"
              continue
            fi

            if jq -e --arg t "$title" 'any(.[]; .title == $t)' <<<"$existing" >/dev/null; then
              echo "Already tracked: $title"
              continue
            fi

            body="$(cat <<EOF
          \`brew livecheck\` found a newer upstream release for the **${name}** cask.

          | | Version |
          |---|---|
          | Packaged | \`${current}\` |
          | Upstream | \`${latest}\` |

          Update checklist for \`Casks/${name}.rb\`:

          - [ ] Bump \`version\` to \`${latest}\`
          - [ ] Verify the macOS artifacts in the upstream listing and update
                the download URL if needed
          - [ ] Recompute \`sha256\` (per-arch where the cask is multi-arch)
          - [ ] \`brew style Casks/${name}.rb && brew audit --cask eventb-rossi/tap/${name}\`

          _Opened automatically by the daily release-tracker workflow._
          EOF
          )"

            echo "Filing issue: $title"
            url="$(gh issue create --title "$title" --label livecheck --body "$body")"
            new="${url##*/}"

            # Supersede older open issues for the same cask (an earlier target version).
            jq -r --arg p "${name}: " '.[] | select(.title | startswith($p)) | .number' <<<"$existing" |
            while read -r num; do
              gh issue close "$num" --comment "Superseded by #${new} (${title})."
            done
          done
